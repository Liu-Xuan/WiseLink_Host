interface:
  display_name: 'WiseLink 工程评估主控'
  short_description: '通过唯一托管 profile 编排 R09 首次分析与交互复核候选。'
  default_prompt: 'Use $wiselink-research-and-synthesize in exactly one Host-authorized mode. For INITIAL_ANALYSIS, route TRANSLATE, EXTRACT_APPLICABILITY, EVALUATE_JOBAID, or SYNTHESIZE_OVERALL only through its dedicated Host begin/commit pair; applicability model output is source-condition AST only and Host owns Fleet/Kleene/level/contentRef/CAS/current. After Host adoption of configuration evidence, use the c18 P0B coordinator and only the existing exact20 MCP tools. Follow the Host-sanitized configurationEvidenceReevaluation nextStage through Applicability, Dynamic N/N, and Overall with a fresh status read after every stage; resume from the Host stage instead of assuming a preceding serving current changed. For configuration-evidence P0B, any WAITING_INPUT, FAILED, or CONFLICT stage is terminal for the current coordinator run: return the Host terminal state immediately, do not continue to a downstream stage, and do not retry automatically. Never inspect or require an internal staged bundle. For TRANSLATE, preserve every Host numeric token and occurrence count exactly and preserve every matched ATA token verbatim. Never split digits joined to letters or OCR into a new standalone number, never split a leading-zero token, and never repair, separate, or reorder a concatenated OCR decimal/table string when that changes Host tokenization. Compare complete calendar dates by the same date value, including equivalent Chinese year/month/day notation; keep numeric values next to Chinese text visible to validation. Recognize ATA chapters only from explicit ATA references. Each output index translates its own source fragment, with the full document retained for understanding. Before accepting an output window, use the same Host rulePack findings to request only failed indices again from the same selected model and native session, at most twice per window within the original total timeout. The caller must not invent or edit translation text. Validate the complete translation-pair before sealing or any UPLOAD_PART; exhausted corrections stop with unitKey diagnostics. Do not replay failed Host attempts. For ordinary non-P0B INITIAL_ANALYSIS, a Host-resolved applicability WAITING_INPUT is terminal only for that ActionAttempt: do not call the applicability model or change UNKNOWN to TRUE/FALSE, but continue Host-authorized Dynamic N/N, Job-Aid, and overall. Overall must consume Host applicabilityResult and preserve its deterministic APPLICABLE, NOT_APPLICABLE, or UNKNOWN/WAITING_INPUT status exactly; it must never downgrade a current Host result to generic human review. When applicabilityResult is null or UNKNOWN, name only the facts required by current SourceRefs and Host missing inputs, keep conditional UNKNOWN, and request engineer or later controlled-data confirmation; never import equipment or software names from another document. Overall engineeringSummary must give a source-bound engineering conclusion, significance, applicability and fleet match, implementation impact, disposition priority, and one to three actions; every statement cites a current DocumentVersion SourceRef and identifies SOURCE_FACT or CONDITIONAL_INFERENCE. For INTERACTIVE_REVIEW, run scripts/run-hosted-review-turn.mjs as the only controller of the exact C3 five-tool sequence; the model must never call Host MCP tools or retain begin/lease/commit state; keep read-only explanation and investigation revision-neutral, and include uncertainty dispositions plus a candidate-only Decision Snapshot only when drafting a Host-confirmable change. Keep inner candidate.sourceRefs as read sourceRefId strings, but derive outer ResultEnvelope.sourceRefs only as artifact {ref,sha256} values with reviewCandidateArtifactRefs; never copy the inner IDs to the outer field. The deterministic driver must checkpoint every remote step with private permissions, persist only non-content model output-shape metadata before strict parsing, fail closed on any ambiguous non-commit outcome, use only one status read for an ambiguous commit, fresh-read Host context and SourceRefs, consume the actual readable model provenance selected by the official hosted profile/config, allow read_wiselink_review_sources to request only relevant Host-authorized fragments through the driver, continue analysis from each result using the Host-provided native session when available, keep that routing key outside model input, otherwise explicitly report legacy per-turn isolation, read citations anew each turn, and finish once with return_wiselink_review_candidate; prefer blank or null assistant content and consume only direct strict JSON object function arguments; the official Gateway may attach plain-text commentary, which the driver discards without parsing, saving as candidate, forwarding or treating as evidence; retain only its safe output-shape metadata, reject prose-only responses, every other function, multiple choices or parallel calls, analysis fields, unsupported content types and fence/prose/array/null argument wrappers, validate the full ResultEnvelope with nonempty prompt/Skill r09.c30/MCP 1.2.0 provenance, and submit the unique review commit only through canonical resultJson without executing ReviewAction or changing revision/current/STALE.'
