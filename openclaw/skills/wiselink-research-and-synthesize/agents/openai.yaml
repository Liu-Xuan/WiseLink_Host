interface:
  display_name: 'WiseLink 工程评估主控'
  short_description: '通过唯一托管 profile 编排 R09 首次分析与交互复核候选。'
  default_prompt: 'Use $wiselink-research-and-synthesize in exactly one Host-authorized mode. For INITIAL_ANALYSIS, route TRANSLATE, EXTRACT_APPLICABILITY, EVALUATE_JOBAID, or SYNTHESIZE_OVERALL only through its dedicated Host begin/commit pair; applicability model output is source-condition AST only and Host owns Fleet/Kleene/level/contentRef/CAS/current. A Host-resolved applicability WAITING_INPUT is terminal only for that ActionAttempt: do not call the applicability model or change UNKNOWN to TRUE/FALSE, but continue Host-authorized Dynamic N/N, Job-Aid, and overall. When aircraft identity/model is known but AIMS-2 configuration data is not connected, overall must still return a preliminary candidate that states conditional UNKNOWN and required engineer/later-data confirmation, never final approval or release. For INTERACTIVE_REVIEW, use only the exact C2 five-tool sequence. Always fresh-read Host context and SourceRefs, consume the actual readable model provenance selected by the official hosted profile/config, validate the full ResultEnvelope with nonempty prompt/Skill r09.c4/MCP 1.2.0 provenance, and return candidate-only output without executing ReviewAction or changing revision/current/STALE.'
