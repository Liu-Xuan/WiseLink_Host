interface:
  display_name: 'WiseLink 工程评估主控'
  short_description: '通过唯一托管 profile 编排 R09 首次分析与交互复核候选。'
  default_prompt: 'Use $wiselink-research-and-synthesize in exactly one Host-authorized mode. For INITIAL_ANALYSIS, route TRANSLATE, EXTRACT_APPLICABILITY, EVALUATE_JOBAID, or SYNTHESIZE_OVERALL only through its dedicated Host begin/commit pair; applicability model output is source-condition AST only and Host owns Fleet/Kleene/level/contentRef/CAS/current. For TRANSLATE, preserve every Host numeric token and occurrence count exactly and preserve every matched ATA token verbatim. Never split digits joined to letters or OCR into a new standalone number, never split a leading-zero token, and never repair, separate, or reorder a concatenated OCR decimal/table string when that changes Host tokenization. Run the Skill translation-pair validator after model generation and before sealing or any UPLOAD_PART; on failure, stop with its unitKey diagnostics and do not rewrite the model output automatically. A Host-resolved applicability WAITING_INPUT is terminal only for that ActionAttempt: do not call the applicability model or change UNKNOWN to TRUE/FALSE, but continue Host-authorized Dynamic N/N, Job-Aid, and overall. Overall must consume Host applicabilityResult and preserve its deterministic APPLICABLE, NOT_APPLICABLE, or UNKNOWN/WAITING_INPUT status exactly; it must never downgrade a current Host result to generic human review. When applicabilityResult is null or UNKNOWN, name only the facts required by current SourceRefs and Host missing inputs, keep conditional UNKNOWN, and request engineer or later controlled-data confirmation; never import equipment or software names from another document. Overall engineeringSummary must give a source-bound engineering conclusion, significance, applicability and fleet match, implementation impact, disposition priority, and one to three actions; every statement cites a current DocumentVersion SourceRef and identifies SOURCE_FACT or CONDITIONAL_INFERENCE. For INTERACTIVE_REVIEW, use only the exact C3 five-tool sequence; keep read-only explanation and investigation revision-neutral, and include uncertainty dispositions plus a candidate-only Decision Snapshot only when drafting a Host-confirmable change. Keep inner candidate.sourceRefs as read sourceRefId strings, but derive outer ResultEnvelope.sourceRefs only as artifact {ref,sha256} values with reviewCandidateArtifactRefs; never copy the inner IDs to the outer field. Always fresh-read Host context and SourceRefs, consume the actual readable model provenance selected by the official hosted profile/config, validate the full ResultEnvelope with nonempty prompt/Skill r09.c6/MCP 1.2.0 provenance, and submit the unique review commit only through canonical resultJson without executing ReviewAction or changing revision/current/STALE.'
